<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness 桌面端 - 安装引导</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(1200px 720px at 50% 42%, #e8f1ff 0%, #f5faff 48%, #ffffff 100%);
    color: #16315e;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }

  .halo {
    position: absolute;
    left: 50%; top: 42%;
    width: 560px; height: 560px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(59,130,246,.30) 0%, rgba(59,130,246,.12) 38%, rgba(59,130,246,0) 70%);
    filter: blur(10px);
    animation: breathe 3.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .75; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
  }

  .card { position: relative; text-align: center; z-index: 1; max-width: 560px; }

  .brand { display: inline-flex; align-items: center; gap: 18px; }
  .logo {
    width: 78px; height: 78px; border-radius: 22px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; color: #fff;
    box-shadow: 0 10px 34px rgba(37, 99, 235, .35);
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; font-weight: 700; }
  .wordmark .name { font-size: 34px; letter-spacing: .5px; color: #16315e; }
  .wordmark .tag {
    font-size: 15px; letter-spacing: 2px; color: #fff;
    background: #16315e; padding: 5px 12px; border-radius: 999px;
    transform: translateY(-4px);
  }

  h1 { margin-top: 32px; font-size: 19px; font-weight: 600; color: #16315e; }
  .sub { margin-top: 10px; font-size: 13px; color: #5b6b8c; line-height: 1.9; }
  code { background: #e8f1ff; padding: 2px 8px; border-radius: 6px; color: #2563eb; font-size: 12px; }

  ol.steps {
    margin: 24px auto 0;
    text-align: left;
    display: inline-block;
    font-size: 13px;
    color: #33486e;
    line-height: 2.1;
  }
  ol.steps li::marker { color: #2563eb; font-weight: 700; }

  .status { margin-top: 20px; font-size: 12.5px; color: #7c8cad; }
  .status.ok { color: #0e9f6e; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #2563eb; margin-right: 7px;
    box-shadow: 0 0 8px rgba(37,99,235,.5);
    animation: pulse 1.2s infinite;
    transform: translateY(-1px);
  }
  @keyframes pulse { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }

  button {
    margin-top: 22px; padding: 9px 30px; font-size: 13px;
    border: none; border-radius: 999px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 18px rgba(37,99,235,.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 9px 24px rgba(37,99,235,.4); }
  button:active { transform: translateY(0); }

  .foot {
    position: absolute; bottom: 34px; left: 0; right: 0;
    text-align: center;
    font-size: 10.5px; letter-spacing: 4px; color: #9db2d8;
  }
</style>
</head>
<body>
<div class="halo"></div>

<div class="card">
  <div class="brand">
    <div class="logo">DS</div>
    <div class="wordmark"><span class="name">DeepSeek</span><span class="tag">HARNESS</span></div>
  </div>

  <h1>需要先安装 DeepSeek Harness</h1>
  <p class="sub">桌面端只是 DSH 的界面外壳,本机还没有找到 <code>dsh</code> 命令,<br>因此无法自动启动本地服务。按下面 3 步操作:</p>

  <ol class="steps">
    <li>安装 DeepSeek Harness,或把 <code>dsh</code> 所在目录加入系统 PATH</li>
    <li>也可以设置环境变量 <code>DSH_CMD</code> 指向 <code>dsh.cmd</code> 的完整路径</li>
    <li>设置环境变量 / PATH 后请<strong>完全退出并重新打开本应用</strong></li>
  </ol>

  <div class="status"><span class="dot"></span><span id="msg">正在检测本地服务 ...</span></div>

  <button id="retry">重新检测</button>
</div>

<div class="foot">DEEPSEEK HARNESS · DESKTOP</div>

<script>
  const SERVER_URL = 'http://127.0.0.1:3080';
  const msgEl = document.getElementById('msg');
  const statusEl = document.querySelector('.status');

  async function check() {
    try {
      const r = await fetch(SERVER_URL, { method: 'GET', cache: 'no-store', mode: 'no-cors' });
      // no-cors 下能拿到 opaque 响应 => 服务确实在,只是跨源看不见状态码
      if (r.type === 'opaque' || r.ok || r.status < 500) {
        statusEl.classList.add('ok');
        location.href = SERVER_URL;
        return true;
      }
      throw new Error('status ' + r.status);
    } catch (e) {
      statusEl.classList.remove('ok');
      msgEl.textContent = '服务未启动 · ' + new Date().toLocaleTimeString();
      return false;
    }
  }

  // 重新检测:若你已经手动启动了 dsh web,这里会直接进入界面
  document.getElementById('retry').onclick = () => { location.reload(); };

  (function loop() {
    check().then(ok => { if (!ok) setTimeout(loop, 5000); });
  })();
</script>
</body>
</html>
